version: '3.8'

services:
  # SQL Server Database
  db:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: bookclub-db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD}

    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "${SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - bookclub-network

  # .NET Backend API
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: bookclub-backend
    restart: always
    ports:
      - "7050:8080"
    volumes:
      - ./Backend/Goodreads.API/wwwroot/uploads:/app/wwwroot/uploads
      - ./Backend/Goodreads.API/wwwroot/images:/app/wwwroot/images
    environment:

      - ConnectionStrings__DefaultConnection=Server=db;Database=GoodreadsDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - RunMigrations=true
      - EmailSettings__UseSendGrid=true
      - OpenAI__ApiKey=${OPENAI_API_KEY}
      - EmailSettings__SendGridApiKey=${SENDGRID_API_KEY}
      - EmailSettings__FromEmail=huseynovruslan999@gmail.com
      - EmailSettings__FromName=BookClub
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=GoodreadsAPI
      - JwtSettings__Audience=GoodreadsClient
      - JwtSettings__TokenExpirationInMinutes=43200

    depends_on:
      db:
        condition: service_healthy
    networks:
      - bookclub-network

  # React Frontend
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: bookclub-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - bookclub-network

networks:
  bookclub-network:
    driver: bridge

volumes:
  sqlserver_data:
