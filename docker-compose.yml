version: '3.8'

services:
  # SQL Server Database
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bookclub-db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=MyStrongPass123!
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "MyStrongPass123!" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - bookclub-network

  # .NET Backend API
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: bookclub-backend
    restart: always
    ports:
      - "7050:8080"
    volumes:
      - ./Backend/Goodreads.API/wwwroot/uploads:/app/wwwroot/uploads
      - ./Backend/Goodreads.API/wwwroot/images:/app/wwwroot/images
    environment:

      - ConnectionStrings__DefaultConnection=Server=db;Database=GoodreadsDb;User Id=sa;Password=MyStrongPass123!;TrustServerCertificate=True;
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - RunMigrations=true
      - EmailSettings__UseSendGrid=true
      - OpenAI__ApiKey=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
      - EmailSettings__SendGridApiKey=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
      - EmailSettings__FromEmail=huseynovruslan999@gmail.com
      - EmailSettings__FromName=BookClub
      - JwtSettings__Secret=BookClub2025SecretKeyForJWTTokenGeneration!@#$%^&*()
      - JwtSettings__Issuer=GoodreadsAPI
      - JwtSettings__Audience=GoodreadsClient
      - JwtSettings__TokenExpirationInMinutes=43200

    depends_on:
      db:
        condition: service_healthy
    networks:
      - bookclub-network

  # React Frontend
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: bookclub-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - bookclub-network

networks:
  bookclub-network:
    driver: bridge

volumes:
  sqlserver_data:
