# =============================================================================
# Docker Compose Override - Development Configuration
# =============================================================================
# This file is automatically loaded with docker-compose.yml
# It provides development-specific settings
# =============================================================================

services:
  backend:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Enable Swagger in development
      - ASPNETCORE_SWAGGER_ENABLED=true
      # Enable auto migrations in development
      - RunMigrations=true
    # Mount source for hot reload (optional - remove for faster builds)
    # volumes:
    #   - ./Backend:/src:ro

  frontend:
    build:
      args:
        VITE_API_URL: http://localhost:5000
