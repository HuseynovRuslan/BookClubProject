server {
    listen 80;
    server_name bookla.org www.bookla.org;
    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name bookla.org www.bookla.org;

    ssl_certificate /etc/letsencrypt/live/bookla.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bookla.org/privkey.pem;

    # Frontend
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API - Directly to backend to match strict CORS/Auth requirements if needed
    # But since frontend proxies /api/ logic, we can also just send everything to frontend.
    # HOWEVER, looking at nginx.conf, frontend handles /api/.
    # So proxying to frontend:80 is sufficient for both / and /api/
}
